server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: compliance-api
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/compliance}
    username: ${SPRING_DATASOURCE_USERNAME:compliance}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

syncpoint:
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-long-random-secret-of-at-least-32-bytes}
    access-token-expiration: PT15M
    refresh-token-expiration: P7D
    issuer: syncpoint-compliance
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minio}
    secret-key: ${S3_SECRET_KEY:change-me-minio-secret}
    bucket: ${S3_BUCKET:evidence}
  secrets:
    master-key: ${SECRET_STORE_MASTER_KEY:}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    enabled: ${AI_SERVICE_ENABLED:true}
    timeout: PT30S
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
    rate-limit:
      auth-max: ${AUTH_RATE_LIMIT_MAX:20}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.syncpoint: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-------}/%X{orgId:-------------}/%X{userId:-------------}] %logger{28} - %msg%n"
